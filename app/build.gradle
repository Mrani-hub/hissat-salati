plugins { id 'com.android.application' }

android {
    namespace 'ma.hissatsalati'
    compileSdk 34

    defaultConfig {
        applicationId "ma.hissatsalati"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "2.8"
    }

    // Signature : la clé vient des variables d'environnement (secrets GitHub),
    // jamais du code. Sans ces variables, on retombe sur la clé de débogage locale.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "hissat"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'   // session média : touches de volume pendant l'adhan
    // Lecture du tableau mensuel à partir d'une photo. Variante « bundled » :
    // le modèle est dans l'APK, donc la reconnaissance marche sans connexion et
    // sans les services Google. Elle coûte environ 4 Mo à l'application.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
