plugins { id 'com.android.application' }

android {
    namespace 'ma.hissatsalati'
    compileSdk 34

    defaultConfig {
        applicationId "ma.hissatsalati"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "2.8"

        // Le moteur de lecture d'image pèse 11 Mo par type de processeur, et un APK
        // en embarque quatre par défaut : 45 Mo au total, impossible à envoyer par
        // WhatsApp ou à retélécharger à chaque mise à jour. On ne garde que le
        // processeur 64 bits (arm64-v8a), celui de tous les téléphones depuis 2016 :
        // l'APK tombe à 16 Mo. Conséquence assumée : les rares téléphones 32 bits
        // ne peuvent plus l'installer, ni la mettre à jour.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Signature : la clé vient des variables d'environnement (secrets GitHub),
    // jamais du code. Sans ces variables, on retombe sur la clé de débogage locale.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "hissat"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'   // session média : touches de volume pendant l'adhan
    // Lecture du tableau mensuel à partir d'une photo. Variante « bundled » :
    // le modèle est dans l'APK, donc la reconnaissance marche sans connexion et
    // sans les services Google. Elle coûte environ 4 Mo à l'application.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // ML Kit traîne avec lui une vieille bibliothèque Kotlin (1.6.21) découpée en
    // trois morceaux : stdlib, stdlib-jdk7 et stdlib-jdk8. Depuis Kotlin 1.8 les
    // deux derniers ont été fondus dans le premier, et mélanger les deux époques
    // donne des classes en double, ce qui fait échouer la compilation. On impose
    // donc la même version partout ; en 1.8.22 les deux morceaux jdk7/jdk8 sont
    // des coquilles vides qui renvoient vers stdlib, et le doublon disparaît.
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
