name: APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier dans Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est déjà préinstallé sur les machines GitHub (ANDROID_HOME) :
      # on installe seulement les composants dont le projet a besoin.
      - name: Composants du SDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Récupérer la clé de signature (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_B64 et KEYSTORE_PASSWORD manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hissat-salati.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/hissat-salati.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk hissat-salati.apk

      - name: Lire le numéro de version
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK (artefact du run)
        uses: actions/upload-artifact@v4
        with:
          name: hissat-salati-apk
          path: hissat-salati.apk
          if-no-files-found: error

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: حصة صلاتي ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          files: hissat-salati.apk
